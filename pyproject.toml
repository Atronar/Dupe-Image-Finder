[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "duplicatefinder"
version = "0.1.0"
description = "Сравнение изображений по интегральным характеристикам"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
]

[project.optional-dependencies]
opencv = ["opencv-python>=4.8"]
pillow = ["pillow>=10"]
vips = ["pyvips-binary>=2.2"]
gpu = ["cupy-cuda13x"]
dev = [
    "pytest>=7.0",
    "opencv-python>=4.8",
    "pillow>=10",
    "mypy>=1.8",
    "pyflakes>=3.0",
]

[tool.setuptools]
py-modules = ["duplicatefinder"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
# Проверка типов пока неблокирующая: ошибки в необязательных бэкендах
# (CuPy, pyvips) исправляются постепенно.
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
